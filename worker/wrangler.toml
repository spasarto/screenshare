name = "screenshare-signaling"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Custom domain: screenshare.aghj.dev (set in Cloudflare dashboard)

[[durable_objects.bindings]]
name = "SESSION_DO"
class_name = "Session"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_classes = ["Session"]

[[migrations]]
tag = "v2"
new_classes = ["RateLimiter"]

# Secrets (set via `wrangler secret put`):
#   TURN_TOKEN_ID
#   TURN_API_TOKEN
