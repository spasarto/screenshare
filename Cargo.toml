[package]
name = "screenshare"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
webrtc = "0.17"
openh264 = "0.9"
eframe = "0.36"
egui = "0.36"
windows-capture = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", features = ["json", "blocking"] }
image = { version = "0.25", default-features = false, features = ["png"] }
aes-gcm = "0.11"
sha2 = "0.11"
rand = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
